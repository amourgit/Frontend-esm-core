# This docker compose file is used to create a backend environment for the e2e.yml workflow.
# The images are pre-filled with data so that the backend environment can be started within a short time.
version: "3.7"

services:
  gateway:
    image: egen/egen-reference-application-3-gateway:${TAG:-nightly}
    hostname: gateway
    depends_on:
      - frontend
      - backend
    ports:
      - "${E2E_PORT:-8081}:80"

  frontend:
    build:
      context: .
    hostname: frontend
    environment:
      SPA_PATH: /egen/spa
      API_URL: /egen

  backend:
    image: egen/egen-reference-application-3-backend:nightly-with-data
    hostname: backend
    depends_on:
      - db

  db:
    image: egen/egen-reference-application-3-db:nightly-with-data
    hostname: db
