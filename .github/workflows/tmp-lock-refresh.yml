name: tmp-lock-refresh
on:
  push:
    branches: [feat/embed-iframe-rights]
    paths: ['.github/workflows/tmp-lock-refresh.yml']
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Régénérer yarn.lock (plages esm-embed-* uniquement modifiées dans package.json)
        run: YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install --mode=skip-build
      - name: Committer yarn.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          git diff --cached --quiet || git commit -m "chore(deps): yarn.lock — esm-embed-host/protocol 0.5.0"
          git push
