name: Report bundle size

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TURBO_API: 'http://127.0.0.1:9080'
      TURBO_TOKEN: 'turbo-token'
      TURBO_TEAM: ${{ github.repository_owner }}

    steps:
      - uses: actions/checkout@v6

      # `packageManager: yarn@4.x` : Corepack doit être actif avant tout appel à `yarn`.
      - name: 🧶 Enable Corepack (Yarn 4)
        run: corepack enable

      - name: 🛠️ Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: 🚀 Setup a local cache server for Turborepo
        uses: felixmosh/turborepo-gh-artifacts@v4
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          server-token: ${{ env.TURBO_TOKEN }}

      - name: 📊 Compute bundle size report
        uses: preactjs/compressed-size-action@v3
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          minimum-change-threshold: 10000 # 10 KB
          build-script: "turbo run build --color"
          # Yarn 4 : `--frozen-lockfile` (valeur par défaut de l'action) n'existe plus.
          install-script: "yarn install --immutable"
