name: 🔄 Push Translations to Transifex

# Workflow isolé : client Transifex épinglé et vérifié (.github/actions/install-transifex),
# aucun workflow réutilisable externe. Nécessite le secret TRANSIFEX_TOKEN (sinon : avertissement et sortie propre).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/apps/*/translations/en.json'
      - '.tx/config'

concurrency:
  group: tx-push
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push-translations:
    name: Push source strings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TX_TOKEN: ${{ secrets.TRANSIFEX_TOKEN }}
    steps:
      - name: Vérifier le secret Transifex
        id: secret
        run: |
          if [ -z "$TX_TOKEN" ]; then
            echo "::warning title=TRANSIFEX_TOKEN absent::Envoi des chaînes sources ignoré (Settings > Secrets and variables > Actions)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.secret.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer le client Transifex
        if: steps.secret.outputs.present == 'true'
        uses: ./.github/actions/install-transifex

      - name: Envoyer les fichiers sources (en.json)
        if: steps.secret.outputs.present == 'true'
        run: tx push --source
