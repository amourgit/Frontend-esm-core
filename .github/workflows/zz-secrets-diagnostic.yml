name: zz-secrets-diagnostic (temporaire)

# Diagnostic jetable : indique, sans jamais afficher de valeur, quels secrets sont non vides pour un run de ce dépôt.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Présence des secrets (booléens uniquement)
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          TRANSIFEX_TOKEN: ${{ secrets.TRANSIFEX_TOKEN }}
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
          EGEN_BOT_GH_TOKEN: ${{ secrets.EGEN_BOT_GH_TOKEN }}
        run: |
          for n in NPM_AUTH_TOKEN NPM_TOKEN NODE_AUTH_TOKEN TRANSIFEX_TOKEN TX_TOKEN EGEN_BOT_GH_TOKEN; do
            v="${!n}"
            if [ -n "$v" ]; then
              echo "::notice title=secret $n::DEFINI (non vide, ${#v} caractères)"
            else
              echo "::notice title=secret $n::ABSENT ou vide"
            fi
          done
