name: Egen CI

# CI isolée : aucun workflow réutilisable externe, uniquement des actions GitHub officielles
# (épinglées par SHA) et des actions locales (.github/actions).
# Pipeline documenté dans .github/copilot-instructions.md : install --immutable -> build -> verify.

on:
  workflow_dispatch:
    inputs:
      publish_next:
        description: 'Publier une pré-version sur npm (tag « next »). Nécessite le secret NPM_AUTH_TOKEN.'
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Build & verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Node, Corepack et dépendances
        uses: ./.github/actions/setup-yarn

      - name: Cache Turborepo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build
        run: yarn turbo run build --concurrency=5

      # node tools/check-nav-routes.mjs + turbo run lint test typescript
      - name: Verify
        run: yarn verify --concurrency=5

  # Informatif : ne bloque jamais. Signale (annotation) les plages ou yarn.lock en retard sur npm.
  deps-freshness:
    name: Dépendances @egen-civitas (informatif)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Installer Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Comparer plages et yarn.lock aux dernières versions npm
        run: |
          if ! node tools/sync-egen-deps.mjs --check; then
            echo "::warning title=Dépendances @egen-civitas en retard::Lancer « yarn deps:egen » puis committer package.json et yarn.lock."
          fi

  # Publication npm : uniquement sur création d'une release GitHub, ou à la demande (workflow_dispatch).
  # Jamais automatique sur un simple push.
  release:
    name: Publication npm
    needs: verify
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_next)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Vérifier le secret npm
        run: |
          if [ -z "$YARN_NPM_AUTH_TOKEN" ]; then
            echo "::error title=Secret manquant::NPM_AUTH_TOKEN n'est pas défini (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Node, Corepack et dépendances
        uses: ./.github/actions/setup-yarn

      - name: Build
        run: yarn turbo run build --concurrency=5

      - name: Version de pré-release
        if: github.event_name == 'workflow_dispatch'
        run: |
          PRERELEASE_VERSION="$(node -p "require('./package.json').version")-pre.${GITHUB_RUN_NUMBER}"
          yarn workspaces foreach --worktree --topological --exclude @egen/esm-core version "$PRERELEASE_VERSION"

      - name: Publier (tag next)
        if: github.event_name == 'workflow_dispatch'
        run: yarn run ci:publish-next

      - name: Publier (tag latest)
        if: github.event_name == 'release'
        run: yarn run ci:publish
